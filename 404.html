<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Munister Agency</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <style>
    /* Stand-alone on purpose: it must render even if agency.css did not load.
       Same tokens as the main page: white sheet, black pill, serif, one indigo. */
    :root{--ink:#0f1117;--blue:#2f3fc9;--chip:#eef0fb;--muted:#2a2d38}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff;color:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;width:100%;text-align:center}
    .mark{display:inline-block;margin-bottom:36px;padding:9px 26px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
    .code{display:inline-block;padding:3px 13px;border-radius:999px;background:var(--chip);color:var(--blue);font-size:14px}
    h1{margin:18px 0 14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:400;font-size:clamp(38px,8vw,64px);letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
    p{max-width:40ch;margin:0 auto 32px;color:var(--muted)}
    .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--chip);color:var(--blue);font-size:17px;text-decoration:none;transition:background .2s,color .2s}
    .btn:hover{background:var(--blue);color:#fff}
    .solid{background:var(--blue);color:#fff}
    .solid:hover{background:var(--ink)}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="mark" href="/">Munister</a>
    <div><span class="code">Error 404</span></div>
    <h1>This page moved on.</h1>
    <p>The address does not lead anywhere on this site. The services and a way to reach us are one click away.</p>
    <div class="row">
      <a class="btn solid" href="/">Back to the site</a>
      <a class="btn" href="/#contact">Write to us</a>
    </div>
  </div>
</body>
</html>
